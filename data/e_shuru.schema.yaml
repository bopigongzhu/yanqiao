# E_ShuRu-specific schema; dictionary is separately licensed Apache-2.0.
schema:
  schema_id: e_shuru
  name: 言桥全拼
  version: '0.2.5'
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    # Bare m/n act as initials, rather than rare standalone nasal syllables.
    - erase/^[mn]$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: pinyin_simp
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
  initial_quality: 1
menu:
  page_size: 7
